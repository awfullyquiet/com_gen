<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hey Beautiful Iskus!</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        height: 100vh;
        margin: 0;
        font-family: "Poppins", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      h1 {
        font-family: "Pacifico", cursive;
        font-size: 3em;
        color: #fff;
        margin-bottom: 20px;
      }
      p {
        font-size: 1.5em;
        color: #fff;
        margin: 20px;
        min-height: 80px;
        transition: all 0.3s ease;
      }
      button {
        background-color: #fff;
        border: none;
        padding: 15px 30px;
        font-size: 1em;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        transition: background-color 0.3s, transform 0.3s;
      }
      button:hover {
        background-color: #ffe6e6;
        transform: scale(1.05);
      }
      .hearts {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
      }
      .heart {
        position: absolute;
        width: 20px;
        height: 20px;
        background: url("https://cdn-icons-png.flaticon.com/512/833/833472.png")
          no-repeat center/contain;
        animation: float 10s infinite;
      }
      @keyframes float {
        0% {
          transform: translateY(100%);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(-10%);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="hearts"></div>

    <h1>Hey Beautiful Iskus!</h1>
    <p id="compliment">
      You light up every room you walk into (jyada gori vayeraaa). ✨
    </p>
    <button onclick="newCompliment()">Tell me more!</button>

    <script>
      const compliments = [
        "Your smile is the best thing there is (after your ruko face).",
        "You are more beautiful than a sunset.",
        "Every moment with you is jadooo.",
        "You make my world better just by being you.",
        "Your laughter is my favorite melody. huwewewewe (o wait that's your cry).",
        "You're not just beautiful, you're brilliant.",
        "You have the kindest heart I've ever known (ahem ahem).",
        "Talking to you is the best part of my day (so all day is the best part ig).",
        "You're a masterpiece just like your art.",
        "Everything about you is enchanting.",
        "Jokes are funnier when you tell them.",
        "Your positivity is contagious (but not in a bad way).",
        "You have a heart of gold (and a brain of silver).",
        "You are a treasure, mo tai Jack Sparrow.",
        "You are the melody that makes my heart sing every day (even if it's off-key).",
        "Your imagination paints the world in vibrant colors (tara koi koi bela line baira).",

        "You inspire me to dream bigger and reach higher (even if I need a ladder).",
        "Your beauty is only rivaled by the depth of your soul (and your love for alu).",

        "Your energy feels like a gentle breeze on a summer day (or a fan on full speed).",
      ];

      function newCompliment() {
        const randomIndex = Math.floor(Math.random() * compliments.length);
        document.getElementById("compliment").textContent =
          compliments[randomIndex];
      }

      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = 5 + Math.random() * 5 + "s";
        heart.style.opacity = Math.random();
        heart.style.fontSize = 12 + Math.random() * 20 + "px";
        document.querySelector(".hearts").appendChild(heart);
      }
    </script>
  </body>
</html>
